name = "ctgrind"
version = "0.0.0"
description = "Constant-time analysis harness using Valgrind/memcheck"

[[pins]]
sparktls = { path = "../.." }

#  FIPS 140-3 integrity test: write the module MACs into every executable
#  this crate links (tools/fips_inject); without it RBG.Init refuses to start.
[[actions]]
type = "post-build"
command = ["bash", "../../tools/fips_inject/inject_all.sh", "../../bin/tests/ctgrind"]

name = "sparktls_examples"
description = "SPARKTLS example programs"
version = "0.0.0"

authors = ["Jon Andrew"]
maintainers = ["Jon Andrew <jonfandrew@fastmail.com>"]
maintainers-logins = ["docandrew"]

[[depends-on]]
gnat = ">=14.2.1"
[[depends-on]]
sparktls = "~0.0.0"
[[depends-on]]
sparkentropy = "~0.0.1"

[[pins]]
sparktls = { path='..' }
sparkentropy = { path='../../sparkentropy' }

#  FIPS 140-3 integrity test: write the module MACs into every executable
#  this crate links (tools/fips_inject); without it RBG.Init refuses to start.
[[actions]]
type = "post-build"
command = ["bash", "../tools/fips_inject/inject_all.sh", "../bin/examples"]
